---
# One IPAM namespace per L3VPN, holding that customer's address space.
#
# Customer LANs are private space the customer picked, so two customers may use
# the same prefix — IpamPrefix is unique on [prefix__value, ip_namespace], so
# without a namespace each the second one would resolve to the first one's row
# and the two VPNs would fight over its `vrf`. The generator binds the same
# namespace to the VRF it creates, and puts each site's LAN gateway address in
# it (see generators/common.py: ip_namespace_name). Provider space — the PE-CE
# /30s from pe_ce_pool — stays in `default`.
#
# These must load before the prefixes below, which reference them by name.
apiVersion: infrahub.app/v1
kind: Object
spec:
  kind: IpamNamespace
  data:
    - {name: vrf-trading-floor-vpn, description: Customer address space for L3VPN trading-floor-vpn.}
    - {name: vrf-ib-advisory-vpn, description: Customer address space for L3VPN ib-advisory-vpn.}

---
# Customer LAN prefixes, one per CE. These are the subnets configured on each
# CE's Ethernet2 and advertised into the VPN over PE-CE eBGP; the generator
# binds them to the VPN's VRF.
apiVersion: infrahub.app/v1
kind: Object
spec:
  kind: IpamPrefix
  data:
    - {prefix: 10.200.10.0/24, description: Trading floor LAN — London, status: active, role: public, ip_namespace: vrf-trading-floor-vpn}
    - {prefix: 10.200.20.0/24, description: Trading floor LAN — Zurich, status: active, role: public, ip_namespace: vrf-trading-floor-vpn}
    - {prefix: 10.200.30.0/24, description: Deal floor LAN — London, status: active, role: public, ip_namespace: vrf-ib-advisory-vpn}
    - {prefix: 10.200.40.0/24, description: Deal floor LAN — Zurich, status: active, role: public, ip_namespace: vrf-ib-advisory-vpn}

---
# Two L3VPNs, one per customer department, each with two sites on the hub PEs.
#
# `bgp_peer_asn` is deliberately absent: the L3VPN generator allocates one
# customer ASN per VPN from `customer_asn_pool` (objects/50_pools.yml) and
# links it as the VPN's `customer_asn`. Setting `bgp_peer_asn` on a site is
# still supported as a per-site override for datasets and Service Catalog
# requests that need a specific AS.
#
# `vlan_pool` names the customer's VLAN pool (52_vlan_pools.yml). The generator
# allocates one VLAN from it per site and hangs a dot1q sub-interface off that
# site's `ce_private_interface`, carrying the VLAN and the LAN gateway address.
#
# Each site names the CE it terminates on. `pe_interface` is not set here —
# the generator matches the pre-provisioned PE port by its description
# ("L3VPN <vpn name>", see objects/datasets/financial/60_backbone.yml) so the
# wiring stays exactly as drawn instead of being allocated from the free pool.
#
# The l3vpns group is the generator target, so adding each VPN there fires
# generate_l3vpn, which materialises the VRF, RTs, PE-CE /30 allocation, the
# customer ASN, and the PE-side and CE-side eBGP sessions.
apiVersion: infrahub.app/v1
kind: Object
spec:
  kind: ServiceL3Vpn
  data:
    - name: trading-floor-vpn
      description: Markets & Trading floor L3VPN — London and Zurich trading floors.
      vpn_id: 100
      vlan_pool: vlan_pool_markets_trading
      address_family: ipv4
      status: draft
      tenant:
        kind: OrganizationTenant
        data:
          name: markets-trading
      member_of_groups:
        - l3vpns
      sites:
        kind: ServiceL3VpnSite
        data:
          - name: trading-london
            pe_device: pe-01
            ce_device: ce-trading-lon
            ce_interface: ["ce-trading-lon", "Ethernet1"]
            ce_private_interface: ["ce-trading-lon", "Ethernet2"]
            customer_subnet: ["10.200.10.0/24", "vrf-trading-floor-vpn"]
            routing_protocol: ebgp
          - name: trading-zurich
            pe_device: pe-08
            ce_device: ce-trading-zrh
            ce_interface: ["ce-trading-zrh", "Ethernet1"]
            ce_private_interface: ["ce-trading-zrh", "Ethernet2"]
            customer_subnet: ["10.200.20.0/24", "vrf-trading-floor-vpn"]
            routing_protocol: ebgp

    - name: ib-advisory-vpn
      description: Investment Banking advisory L3VPN — London and Zurich deal floors.
      vpn_id: 101
      vlan_pool: vlan_pool_investment_banking
      address_family: ipv4
      status: draft
      tenant:
        kind: OrganizationTenant
        data:
          name: investment-banking
      member_of_groups:
        - l3vpns
      sites:
        kind: ServiceL3VpnSite
        data:
          - name: ib-london
            pe_device: pe-01
            ce_device: ce-ib-lon
            ce_interface: ["ce-ib-lon", "Ethernet1"]
            ce_private_interface: ["ce-ib-lon", "Ethernet2"]
            customer_subnet: ["10.200.30.0/24", "vrf-ib-advisory-vpn"]
            routing_protocol: ebgp
          - name: ib-zurich
            pe_device: pe-08
            ce_device: ce-ib-zrh
            ce_interface: ["ce-ib-zrh", "Ethernet1"]
            ce_private_interface: ["ce-ib-zrh", "Ethernet2"]
            customer_subnet: ["10.200.40.0/24", "vrf-ib-advisory-vpn"]
            routing_protocol: ebgp
