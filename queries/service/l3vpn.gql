query L3Vpn($name: String!) {
  ServiceL3Vpn(name__value: $name) {
    edges {
      node {
        id
        name { value }
        vpn_id { value }
        address_family { value }
        status { value }
        tenant { node { id name { value } } }
        sites {
          edges {
            node {
              id
              name { value }
              routing_protocol { value }
              bgp_peer_asn { value }
              static_routes { value }
              status { value }
              pe_device { node { id name { value } platform { node { name { value } } } } }
              # The CE fields below are inputs this query is allowed to return:
              # the generator reads them, it never creates them. The objects it
              # does create must stay out of this query or the query group
              # destabilises the proposed-change pipeline — see the module
              # docstring of tests/catalog/test_sdwan_generator_registration.py,
              # which guards exactly that.
              ce_device { node { id name { value } } }
              ce_interface { node { id name { value } } }
              customer_subnet { node { id prefix { value } } }
            }
          }
        }
      }
    }
  }
  TopologyMplsBackbone(name__value: "mpls-backbone-1") {
    edges { node { asn { node { id asn { value } } } } }
  }
}
