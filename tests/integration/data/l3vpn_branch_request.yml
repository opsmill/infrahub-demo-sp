---
# Integration-test service request, loaded onto a branch to mimic what the
# Streamlit service catalog does.
#
# Chosen so it never collides with the bootstrap dataset:
#   - vpn_id 150 sits in the 100-199 range reserved for on-disk services
#     (`vpn_id_pool` hands out 200+), so RD 65000:150 is unique and the
#     l3vpn_overlap check passes.
#   - 10.201.x.0/24 subnets are disjoint from the bootstrap 10.200.x.0/24
#     LANs and from each other, so the l3vpn_site_subnet check passes.
#   - pe-05 / pe-06 carry no bootstrap L3VPN, so the generator has to pick
#     genuinely free physical interfaces on them.
apiVersion: infrahub.app/v1
kind: Object
spec:
  kind: IpamPrefix
  data:
    - {prefix: 10.201.10.0/24, description: Integration test LAN — Milan, status: active, role: public}
    - {prefix: 10.201.20.0/24, description: Integration test LAN — Madrid, status: active, role: public}

---
# Adding the service to the `l3vpns` group is what fires generate_l3vpn on
# this branch, via the CoreGroupTriggerRule in objects/events/00_triggers.yml.
apiVersion: infrahub.app/v1
kind: Object
spec:
  kind: ServiceL3Vpn
  data:
    - name: integration-test-vpn
      description: L3VPN created by the integration suite to exercise the service workflow.
      vpn_id: 150
      address_family: ipv4
      status: draft
      tenant:
        kind: OrganizationTenant
        data:
          name: markets-trading
      member_of_groups:
        - l3vpns
      sites:
        kind: ServiceL3VpnSite
        data:
          - name: milan
            pe_device: pe-05
            customer_subnet: ["10.201.10.0/24", "default"]
            routing_protocol: ebgp
            bgp_peer_asn: 65201
          - name: madrid
            pe_device: pe-06
            customer_subnet: ["10.201.20.0/24", "default"]
            routing_protocol: ebgp
            bgp_peer_asn: 65201
