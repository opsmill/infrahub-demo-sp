---
extends: default

ignore: |
  /.git
  /.venv
  /docs/node_modules
  /docs/pnpm-lock.yaml
  /docs/build
  /docs/.docusaurus
  # Runtime-only, gitignored, and machine-generated (rendered clab topology
  # and the repo object bootstrap pins to the checked-out branch).
  /lab

rules:
  line-length:
    max: 200
    level: warning
  document-start: disable
  truthy:
    check-keys: false
  comments:
    min-spaces-from-content: 1
