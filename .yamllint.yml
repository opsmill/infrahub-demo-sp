---
extends: default

ignore: |
  /.git
  /.venv
  /docs/node_modules
  /docs/pnpm-lock.yaml
  /docs/build
  /docs/.docusaurus
  # Containerlab runtime output, generated by `invoke lab`. Gitignored via
  # `lab/*`, so CI never sees it, but a local `invoke lint-yaml` would walk it
  # and fail on generated indentation.
  /lab

rules:
  line-length:
    max: 200
    level: warning
  document-start: disable
  truthy:
    check-keys: false
  comments:
    min-spaces-from-content: 1
