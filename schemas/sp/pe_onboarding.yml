---
# yaml-language-server: $schema=https://schema.infrahub.app/infrahub/schema/latest.json
version: "1.0"

nodes:
  - name: PeOnboarding
    namespace: Topology
    description: A request to add a PE router to an MPLS backbone.
    label: PE Onboarding
    icon: mdi:router-network-wireless
    include_in_menu: false
    human_friendly_id:
      - name__value
    display_label: name__value
    order_by:
      - name__value
    attributes:
      - name: name
        kind: Text
        unique: true
        description: "Device name of the new PE, for example pe-09."
        order_weight: 1000
      - name: description
        kind: Text
        optional: true
        order_weight: 1100
      - name: status
        kind: Dropdown
        default_value: "draft"
        order_weight: 1200
        choices:
          - name: draft
            label: Draft
            color: "#FFF2CC"
          - name: active
            label: Active
            color: "#A9DFBF"
          - name: decommissioned
            label: Decommissioned
            color: "#D3D3D3"
    relationships:
      - name: backbone
        peer: TopologyMplsBackbone
        cardinality: one
        optional: false
        kind: Attribute
        order_weight: 1300
      - name: location
        peer: LocationSite
        cardinality: one
        optional: false
        kind: Attribute
        order_weight: 1400
      - name: platform
        peer: DcimPlatform
        cardinality: one
        optional: false
        kind: Attribute
        order_weight: 1500
      - name: device_type
        peer: DcimDeviceType
        cardinality: one
        optional: false
        kind: Attribute
        order_weight: 1600
      # Two relationships to DcimDevice need distinct identifiers, or the
      # server merges them into one reverse relationship on the device side.
      - name: uplinks
        description: "Existing PEs the new router gets a core link to. At least two."
        identifier: peonboarding__uplink
        peer: DcimDevice
        cardinality: many
        optional: false
        kind: Attribute
        order_weight: 1700
      - name: device
        description: "Filled by the generator: the DcimDevice this request produced."
        identifier: peonboarding__device
        peer: DcimDevice
        cardinality: one
        optional: true
        kind: Attribute
        order_weight: 1800
