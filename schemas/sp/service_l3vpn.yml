---
# yaml-language-server: $schema=https://schema.infrahub.app/infrahub/schema/latest.json
version: "1.0"

nodes:
  - name: L3Vpn
    namespace: Service
    description: A Layer-3 VPN service offered to a tenant.
    label: L3 VPN
    icon: mdi:vpn
    include_in_menu: false
    human_friendly_id:
      - name__value
    display_label: name__value
    order_by:
      - name__value
    attributes:
      - name: name
        kind: Text
        unique: true
        order_weight: 1000
      - name: description
        kind: Text
        optional: true
        order_weight: 1100
      - name: vpn_id
        kind: Number
        unique: true
        order_weight: 1200
        description: "Allocated from vpn_id_pool. Used to derive RD/RT."
      - name: address_family
        kind: Dropdown
        default_value: "ipv4"
        order_weight: 1300
        choices:
          - name: ipv4
            label: IPv4
          - name: ipv4_ipv6
            label: IPv4 + IPv6
      - name: status
        kind: Dropdown
        default_value: "draft"
        order_weight: 1400
        choices:
          - name: draft
            label: Draft
            color: "#FFF2CC"
          - name: active
            label: Active
            color: "#A9DFBF"
          - name: decommissioned
            label: Decommissioned
            color: "#D3D3D3"
    relationships:
      - name: tenant
        peer: OrganizationGeneric
        cardinality: one
        optional: false
        kind: Attribute
        order_weight: 1500
      - name: vrf
        peer: IpamVRF
        cardinality: one
        optional: true
        kind: Attribute
        order_weight: 1600
      - name: customer_asn
        label: Customer ASN
        description: >-
          Customer AS for every PE-CE eBGP session of this VPN. Allocated
          from customer_asn_pool unless a site sets bgp_peer_asn.
        identifier: l3vpn__customer_asn
        peer: RoutingAutonomousSystem
        cardinality: one
        optional: true
        kind: Attribute
        order_weight: 1650
      - name: vlan_pool
        label: Customer VLAN Pool
        description: >-
          CoreNumberPool the customer's private-side VLAN IDs come from. One
          pool per customer keeps their VLAN ranges separate.
        identifier: l3vpn__vlan_pool
        peer: CoreNumberPool
        cardinality: one
        optional: true
        kind: Attribute
        order_weight: 1660
      - name: sites
        identifier: l3vpn__site
        peer: ServiceL3VpnSite
        cardinality: many
        optional: true
        kind: Component
        order_weight: 1700

  - name: L3VpnSite
    namespace: Service
    description: A single PE attachment of an L3VPN to a customer subnet.
    label: L3VPN Site
    icon: mdi:office-building-marker
    include_in_menu: false
    menu_placement: ServiceL3Vpn
    human_friendly_id:
      - name__value
    display_label: name__value
    order_by:
      - name__value
    uniqueness_constraints:
      - [l3vpn, name__value]
    attributes:
      - name: name
        kind: Text
        order_weight: 1000
      - name: routing_protocol
        kind: Dropdown
        order_weight: 1300
        choices:
          - name: ebgp
            label: eBGP
            color: "#A9CCE3"
          - name: static
            label: Static
            color: "#FFF2CC"
          - name: connected
            label: Connected
            color: "#CDEACC"
      - name: bgp_peer_asn
        kind: Number
        optional: true
        order_weight: 1400
        description: >-
          Per-site override for the PE-CE peer AS. Unset uses the VPN's
          customer_asn, allocated from customer_asn_pool.
      - name: static_routes
        kind: JSON
        optional: true
        order_weight: 1500
      - name: status
        kind: Dropdown
        default_value: "provisioning"
        order_weight: 1200
        choices:
          - name: provisioning
            label: Provisioning
            color: "#FFF2CC"
          - name: active
            label: Active
            color: "#A9DFBF"
          - name: decommissioned
            label: Decommissioned
            color: "#D3D3D3"
    relationships:
      - name: l3vpn
        identifier: l3vpn__site
        peer: ServiceL3Vpn
        cardinality: one
        optional: false
        kind: Parent
        order_weight: 1050
      - name: pe_device
        peer: DcimDevice
        cardinality: one
        optional: false
        kind: Attribute
        order_weight: 1100
      - name: pe_interface
        peer: InterfacePhysical
        cardinality: one
        optional: true
        kind: Attribute
        order_weight: 1150
      - name: ce_device
        label: CE Device
        description: >-
          Pre-provisioned CE router this site terminates on. Set = the
          generator wires the CE side too. Unset = unmanaged CE.
        identifier: l3vpnsite__ce_device
        peer: DcimDevice
        cardinality: one
        optional: true
        kind: Attribute
        order_weight: 1160
      - name: ce_interface
        label: CE Interface
        description: The CE port facing the PE; receives the CE side of the PE-CE /30.
        identifier: l3vpnsite__ce_interface
        peer: InterfacePhysical
        cardinality: one
        optional: true
        kind: Attribute
        order_weight: 1170
      - name: ce_private_interface
        label: CE Private Interface
        description: >-
          CE port facing the customer LAN. The generator hangs the dot1q
          sub-interface off it.
        identifier: l3vpnsite__ce_private_interface
        peer: InterfacePhysical
        cardinality: one
        optional: true
        kind: Attribute
        order_weight: 1180
      - name: customer_subnet
        peer: IpamPrefix
        cardinality: one
        optional: false
        kind: Attribute
        order_weight: 1600
      - name: pe_address
        identifier: l3vpnsite__pe_address
        peer: IpamIPAddress
        cardinality: one
        optional: true
        kind: Attribute
        order_weight: 1700
      - name: ce_address
        identifier: l3vpnsite__ce_address
        peer: IpamIPAddress
        cardinality: one
        optional: true
        kind: Attribute
        order_weight: 1800
