[project]
name = "infrahub-demo-sp"
version = "0.1.0"
description = "Infrahub demo: multi-vendor MPLS backbone with L3VPN as a service"
readme = "README.md"
requires-python = ">=3.11,<3.15"
license = {text = "MIT"}
authors = [{name = "OpsMill"}]

dependencies = [
    "flask>=3.0.0",
    # Floor, not a pin, and no ceiling: uv.lock resolves exactly, so a run is reproducible
    # either way and the only question is who moves the version -- the bump pull request is
    # the designated mover. A stale ceiling costs more than it buys.
    "infrahub-sdk[all]>=1.22.2",
    "invoke>=2.2.0",
    "jinja2>=3.1.3",
    "netmiko>=4.3.0",
    "pandas>=2.0.0",
    "pybatfish>=2024.0",
    "pyyaml>=6.0",
    "requests>=2.31.0",
    "rich>=13.7.0",
    "streamlit>=1.58.0",
]

# Test and lint tooling is not part of the demo application. It lived in
# [project].dependencies here and nowhere else in the four demo repositories,
# which meant anyone installing this project got a type checker and a linter.
[dependency-groups]
dev = [
    # This specifier IS the Infrahub release the integration suite tests: the
    # stack image is derived from the installed testcontainers version. It is
    # what update-infrahub.yml bumps, so a bump PR going red is the signal that
    # a release breaks this demo. A floor rather than the `==` pin it used to
    # be -- uv.lock is what resolves it exactly.
    #
    "infrahub-testcontainers>=1.10.8",
    "mypy>=2.3.1",
    # Imported directly by tests/conftest.py to guard a psutil.cpu_freq()
    # crash on Apple Silicon. It otherwise arrives only transitively through
    # infrahub-testcontainers; declaring it directly means that edge changing
    # can't take the root conftest -- and the whole suite -- down with it.
    "psutil>=5.9.0",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=4.1.0",
    "pytest-dependency>=0.6.0",
    "pytest-order>=1.3.0",
    "rumdl>=0.2.55",
    "ruff>=0.16.1",
    "types-PyYAML>=6.0.0",
    "yamllint>=1.35.0",
]

[tool.uv]
# ariadne-codegen 0.18.0 (pulled in by infrahub-sdk[all]) pins ruff <0.16.0.
# ruff is only a lint/format tool here — never imported at runtime — so the
# transitive pin is overridden rather than holding ruff back.
override-dependencies = ["ruff>=0.16.1"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["generators", "transforms", "checks"]

[tool.ruff]
line-length = 100
# schema_protocols.py is auto-generated by `infrahubctl protocols`; lint/format
# would just re-flag every regeneration.
extend-exclude = ["generators/schema_protocols.py"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "ANN", "D"]
ignore = ["D203", "D213", "ANN401"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["D", "ANN"]
"scripts/*" = ["D"]

[tool.mypy]
# `python_version` is deliberately unset. Pinning it fixes the *semantics* mypy
# checks against while the environment still supplies packages resolved for
# whatever interpreter is running -- and numpy's lock is bifurcated, so a 3.12+
# interpreter installs stubs using PEP 695 `type` statements that a pinned 3.11
# rejects, taking type coverage to zero with "errors prevented further
# checking". The python-lint matrix covers both ends of requires-python
# instead, so each leg checks its own resolved packages.
strict = true
warn_unused_ignores = true

[[tool.mypy.overrides]]
module = "tasks"
ignore_errors = true

# service_catalog pages run with Streamlit's CWD set to service_catalog/,
# so relative imports like `import utils` are correct at runtime but cannot
# be resolved by mypy from the repo root.
[[tool.mypy.overrides]]
module = "service_catalog.*"
ignore_errors = true

# scripts/ are one-off helper scripts, not production modules.
[[tool.mypy.overrides]]
module = "scripts.*"
ignore_errors = true

# Auto-generated by `infrahubctl protocols`; type errors here would just be
# re-introduced each regeneration. Same exclusion strategy as ruff.
[[tool.mypy.overrides]]
module = "generators.schema_protocols"
ignore_errors = true

[[tool.mypy.overrides]]
module = "smoke_create_l3vpn"
ignore_errors = true

[[tool.mypy.overrides]]
module = "push_arista"
ignore_errors = true

# tests/ use untyped fixtures and helpers — relax strict mode there.
[[tool.mypy.overrides]]
module = "tests.*"
ignore_errors = true

[[tool.mypy.overrides]]
module = "netmiko"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "streamlit"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "pandas"
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
# The integration suite keeps its Infrahub container alive for a whole test
# class, so class-scoped async fixtures must share one event loop.
asyncio_default_fixture_loop_scope = "class"
addopts = "--strict-markers"
# `core` and `extended` select scope within the integration tier; `offline`
# marks an integration-suite test that reads only repository files. `extended`
# is live: the proposed-change tail of tests/integration/test_workflow.py
# carries it, so `invoke test-integration --tier core` deselects those tests --
# see issue #111. `core` itself is not applied to a test; the blocking tier is
# expressed as "not extended" rather than as an opt-in marker.
markers = [
    "core: workflows every pull request must keep working. Run with -m 'not extended'.",
    "extended: additional workflows run on dependency bumps and on main. Adds ~30-40 minutes.",
    "offline: an integration-suite test that reads only repository files and needs no deployment.",
]

[tool.rumdl.global]
# `invoke lint-markdown` passes no --fail-on, so rumdl's default `any` severity
# is what CI enforces. What this repository tolerates is therefore
# stated here rather than narrowed at the call site: prose line length, ordered-
# list numbering, inline HTML and a missing top-level heading are all normal in
# Docusaurus MDX.
disable = ["MD013", "MD029", "MD033", "MD041"]
# Historical plans/specs reference paths that don't resolve as filesystem
# links; treat them as reference material, not user-facing docs. The tests
# tree contains fixture markdown that isn't user-facing either, and
# docs/README.md is Docusaurus scaffolding.
exclude = [
    "docs/node_modules",
    "docs/README.md",
    "scratchpad",
    "tests",
]
respect-gitignore = true
