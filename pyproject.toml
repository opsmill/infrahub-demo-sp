[project]
name = "infrahub-demo-sp"
version = "0.1.0"
description = "Infrahub demo: multi-vendor MPLS backbone with L3VPN as a service"
readme = "README.md"
requires-python = ">=3.11,<3.15"
license = {text = "MIT"}
authors = [{name = "OpsMill"}]

dependencies = [
    "flask>=3.0.0",
    "infrahub-sdk[all]>=1.22.2,<2.0.0",
    "invoke>=2.2.0",
    "jinja2>=3.1.3",
    "netmiko>=4.3.0",
    "pandas>=2.0.0",
    "pybatfish>=2024.0",
    "pyyaml>=6.0",
    "requests>=2.31.0",
    "rich>=13.7.0",
    "streamlit>=1.58.0",
]

# Test and lint tooling is not part of the demo application. It lived in
# [project].dependencies here and nowhere else in the four demo repositories,
# which meant anyone installing this project got a type checker and a linter.
[dependency-groups]
dev = [
    # This pin IS the Infrahub release the integration suite tests: the stack
    # image is derived from the installed testcontainers version. It is what
    # update-infrahub.yml bumps, so a bump PR going red is the signal that a
    # release breaks this demo.
    "infrahub-testcontainers==1.10.6",
    "mypy>=2.3.1",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=4.1.0",
    "pytest-dependency>=0.6.0",
    "pytest-order>=1.3.0",
    "rumdl>=0.2.55",
    "ruff>=0.16.1",
    "types-PyYAML>=6.0.0",
    "yamllint>=1.35.0",
]

[tool.uv]
# ariadne-codegen 0.18.0 (pulled in by infrahub-sdk[all]) pins ruff <0.16.0.
# ruff is only a lint/format tool here — never imported at runtime — so the
# transitive pin is overridden rather than holding ruff back.
override-dependencies = ["ruff>=0.16.1"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["generators", "transforms", "checks"]

[tool.ruff]
line-length = 100
target-version = "py311"
# schema_protocols.py is auto-generated by `infrahubctl protocols`; lint/format
# would just re-flag every regeneration. docs/superpowers holds historical plans
# and specs -- reference material, not source -- and ruff 0.16 formats the
# Python code blocks inside their markdown, which pulls four of them into scope.
# Both are excluded from ruff format and ruff check, matching the existing
# [tool.rumdl.global] exclusion.
extend-exclude = ["generators/schema_protocols.py", "docs/superpowers"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "ANN", "D"]
ignore = ["D203", "D213", "ANN401"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["D", "ANN"]
"scripts/*" = ["D"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unused_ignores = true

[[tool.mypy.overrides]]
module = "tasks"
ignore_errors = true

# service_catalog pages run with Streamlit's CWD set to service_catalog/,
# so relative imports like `import utils` are correct at runtime but cannot
# be resolved by mypy from the repo root.
[[tool.mypy.overrides]]
module = "service_catalog.*"
ignore_errors = true

# scripts/ are one-off helper scripts, not production modules.
[[tool.mypy.overrides]]
module = "scripts.*"
ignore_errors = true

# Auto-generated by `infrahubctl protocols`; type errors here would just be
# re-introduced each regeneration. Same exclusion strategy as ruff.
[[tool.mypy.overrides]]
module = "generators.schema_protocols"
ignore_errors = true

[[tool.mypy.overrides]]
module = "smoke_create_l3vpn"
ignore_errors = true

[[tool.mypy.overrides]]
module = "push_arista"
ignore_errors = true

# tests/ use untyped fixtures and helpers — relax strict mode there.
[[tool.mypy.overrides]]
module = "tests.*"
ignore_errors = true

[[tool.mypy.overrides]]
module = "netmiko"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "streamlit"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "pandas"
ignore_missing_imports = true

# numpy is never imported directly here — it arrives transitively through the
# pandas import in checks/batfish_helpers.py. On Python >=3.12 the lock resolves
# numpy >=2.5, whose stubs use PEP 695 `type` statements that mypy rejects while
# checking against the python_version floor this project supports.
# ignore_missing_imports does not apply: the stub is found, so mypy follows it.
# Nothing here is annotated against numpy, so stop following it entirely.
# follow_imports alone is ignored for .pyi files, hence follow_imports_for_stubs.
[[tool.mypy.overrides]]
module = ["numpy", "numpy.*"]
follow_imports = "skip"
follow_imports_for_stubs = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
# The integration suite keeps its Infrahub container alive for a whole test
# class, so class-scoped async fixtures must share one event loop.
asyncio_default_fixture_loop_scope = "class"
addopts = "--strict-markers"
# `core` and `extended` select scope within the integration tier; `offline`
# marks an integration-suite test that reads only repository files. None is
# applied to a test yet -- tests/integration/ predates the contract and is not
# tiered. `invoke test-integration --tier core` starts filtering on `extended`
# the moment the first test carries it.
markers = [
    "core: workflows every pull request must keep working. Run with -m 'not extended'.",
    "extended: additional workflows run on dependency bumps and on main. Adds ~30-40 minutes.",
    "offline: an integration-suite test that reads only repository files and needs no deployment.",
]

[tool.rumdl.global]
# Historical plans/specs reference paths that don't resolve as filesystem
# links; treat them as reference material, not user-facing docs. The tests
# tree contains fixture markdown that isn't user-facing either.
exclude = [
    "docs/node_modules",
    "docs/superpowers",
    "scratchpad",
    "tests",
]
respect-gitignore = true

[tool.coverage.run]
source = ["generators", "transforms", "checks", "service_catalog/utils", "batfish_runner"]
omit = ["tests/*", "scripts/*"]

[tool.coverage.report]
fail_under = 70
