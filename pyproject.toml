[project]
name = "infrahub-demo-sp"
version = "0.1.0"
description = "Infrahub demo: multi-vendor MPLS backbone with L3VPN as a service"
readme = "README.md"
requires-python = ">=3.11,<3.15"
license = {text = "MIT"}
authors = [{name = "OpsMill"}]

dependencies = [
    "flask>=3.0.0",
    "infrahub-sdk[all]>=1.23.0",
    "invoke>=2.2.0",
    "jinja2>=3.1.3",
    "netmiko>=4.3.0",
    "pandas>=2.0.0",
    "pybatfish>=2024.0",
    "pyyaml>=6.0",
    "requests>=2.31.0",
    "rich>=13.7.0",
    "streamlit>=1.58.0",
]

[dependency-groups]
dev = [
    # The Infrahub release the integration suite tests: the stack image follows this version.
    "infrahub-testcontainers>=1.11.0",
    "mypy>=2.3.1",
    "psutil>=5.9.0",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=4.1.0",
    "pytest-dependency>=0.6.0",
    "pytest-order>=1.3.0",
    "rumdl>=0.2.55",
    "ruff>=0.16.1",
    "types-PyYAML>=6.0.0",
    "yamllint>=1.35.0",
]

[tool.uv]
# ariadne-codegen (via infrahub-sdk[all]) pins ruff <0.16.0; ruff is lint-only here.
override-dependencies = ["ruff>=0.16.1"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["generators", "transforms", "checks"]

[tool.ruff]
line-length = 100
# schema_protocols.py is auto-generated by `infrahubctl protocols`.
extend-exclude = ["generators/schema_protocols.py"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "ANN", "D"]
ignore = ["D203", "D213", "ANN401"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["D", "ANN"]
"scripts/*" = ["D"]

[tool.mypy]
# `python_version` deliberately unset: pinning it rejects numpy's PEP 695 stubs on a 3.12+
# interpreter. The python-lint matrix covers both ends of `requires-python` instead.
strict = true
warn_unused_ignores = true

[[tool.mypy.overrides]]
module = "tasks"
ignore_errors = true

# service_catalog pages run with Streamlit's CWD set to service_catalog/,
# so relative imports like `import utils` are correct at runtime but cannot
# be resolved by mypy from the repo root.
[[tool.mypy.overrides]]
module = "service_catalog.*"
ignore_errors = true

# scripts/ are one-off helper scripts, not production modules.
[[tool.mypy.overrides]]
module = "scripts.*"
ignore_errors = true

# Auto-generated by `infrahubctl protocols`; type errors here would just be
# re-introduced each regeneration. Same exclusion strategy as ruff.
[[tool.mypy.overrides]]
module = "generators.schema_protocols"
ignore_errors = true

[[tool.mypy.overrides]]
module = "smoke_create_l3vpn"
ignore_errors = true

[[tool.mypy.overrides]]
module = "push_arista"
ignore_errors = true

# tests/ use untyped fixtures and helpers — relax strict mode there.
[[tool.mypy.overrides]]
module = "tests.*"
ignore_errors = true

[[tool.mypy.overrides]]
module = "netmiko"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "streamlit"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "pandas"
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
# The Infrahub container lives for a whole test class, so class-scoped fixtures share one loop.
asyncio_default_fixture_loop_scope = "class"
addopts = "--strict-markers"
# `extended` is carried by the proposed-change tail of test_workflow.py -- see issue #111.
markers = [
    "core: workflows every pull request must keep working. Run with -m 'not extended'.",
    "extended: additional workflows run on dependency bumps and on main. Adds ~30-40 minutes.",
    "offline: an integration-suite test that reads only repository files and needs no deployment.",
]

[tool.rumdl.global]
# Normal in Docusaurus MDX: prose line length, ordered-list numbering, inline HTML, no H1.
disable = ["MD013", "MD029", "MD033", "MD041"]
# Fixtures and scaffolding, not user-facing docs.
exclude = [
    "docs/node_modules",
    "docs/README.md",
    "scratchpad",
    "tests",
]
respect-gitignore = true
