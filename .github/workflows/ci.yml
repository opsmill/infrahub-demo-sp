---
name: CI
# yamllint disable rule:truthy rule:line-length
on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

jobs:
  files-changed:
    name: Detect which file has changed
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      documentation: ${{ steps.changes.outputs.documentation_all }}
      python: ${{ steps.changes.outputs.python_all }}
      yaml: ${{ steps.changes.outputs.yaml_all }}
      markdown: ${{ steps.changes.outputs.markdown_all }}
    steps:
      - name: "Check out repository code"
        uses: "actions/checkout@v7"
      - name: Check for file changes
        uses: opsmill/paths-filter@v3.0.2
        id: changes
        with:
          token: ${{ github.token }}
          filters: .github/file-filters.yml

  python-lint:
    if: needs.files-changed.outputs.python == 'true'
    needs: ["files-changed"]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "0.9.18"
      - run: uv sync
      # The invoke tasks are the gate; CI calls the same code a developer runs
      # locally, so the two cannot drift. `ruff check --select I .` used to run
      # here and is deliberately gone: `I` is already in the select list, and
      # --select sets rather than extends it, so it could never fail on its own.
      - name: Run ruff
        run: uv run invoke lint-ruff
      - name: Run type checks
        run: uv run invoke lint-mypy

  yaml-lint:
    if: needs.files-changed.outputs.yaml == 'true'
    needs: ["files-changed"]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "0.9.18"
      - run: uv sync
      - name: Run yamllint
        run: uv run invoke lint-yaml

  markdown-lint:
    if: needs.files-changed.outputs.markdown == 'true'
    needs: ["files-changed"]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      # This job keeps the action rather than calling `invoke lint-markdown`,
      # because inline pull-request annotations are worth the inconsistency.
      # The task runs the same `--fail-on error`, so the two gates agree.
      - name: Run rumdl
        uses: rvben/rumdl@v0
        with:
          config: pyproject.toml
          report-type: annotations
          # Only fail CI on errors (broken relative links, missing required
          # frontmatter, etc.). Pre-existing warnings (line length, bare
          # URLs, command prompts) are surfaced as annotations but don't
          # block the build.
          args: --fail-on error

  unit-test:
    if: |
      always() && !cancelled() &&
      !contains(needs.*.result, 'failure') &&
      !contains(needs.*.result, 'cancelled')
    needs: ["python-lint", "yaml-lint", "markdown-lint"]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "0.9.18"
      - run: uv sync
      - name: Run unit tests
        run: uv run invoke test-unit

  # Runs the whole demo against a throwaway Infrahub stack booted by
  # infrahub-testcontainers. The Infrahub release under test is whatever
  # `[dependency-groups] dev` pins infrahub-testcontainers to, which is what
  # update-infrahub.yml bumps when a new version ships — so the bot's PR is
  # what actually validates the new release against this demo.
  integration-test:
    if: |
      always() && !cancelled() &&
      !contains(needs.*.result, 'failure') &&
      !contains(needs.*.result, 'cancelled')
    needs: ["python-lint", "yaml-lint", "markdown-lint"]
    runs-on:
      group: "huge-runners"
    timeout-minutes: 90
    env:
      INFRAHUB_DB_TYPE: neo4j
      INFRAHUB_TIMEOUT: 600
      INFRAHUB_TESTING_LOG_LEVEL: INFO
      # No INFRAHUB_API_TOKEN here on purpose: the suite reads the container's
      # seeded admin token from infrahub_testcontainers, so CI and a local run
      # authenticate identically.
    steps:
      - uses: actions/checkout@v7
      - name: Install tini
        run: "apt-get update && apt-get install -y tini"
      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "0.9.18"
      - run: uv sync
      - name: Set environment variables
        run: |
          RUNNER_NAME=$(echo "${{ runner.name }}" | grep -o 'ghrunner[0-9]\+' | sed 's/ghrunner\([0-9]\+\)/ghrunner_\1/')
          echo "PYTEST_DEBUG_TEMPROOT=/var/lib/github/${RUNNER_NAME}/_temp" >> $GITHUB_ENV
      - name: Run integration tests
        run: exec tini -s -g -- uv run pytest tests/integration/

  documentation:
    defaults:
      run:
        working-directory: ./docs
    if: |
      always() && !cancelled() &&
      !contains(needs.*.result, 'failure') &&
      !contains(needs.*.result, 'cancelled') &&
      needs.files-changed.outputs.documentation == 'true'
    needs: ["files-changed", "yaml-lint", "python-lint", "markdown-lint"]
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true
      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          package_json_file: docs/package.json
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: 'pnpm'
          cache-dependency-path: docs/pnpm-lock.yaml
      - name: Install Node dependencies
        working-directory: docs
        run: pnpm install --frozen-lockfile
      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "0.9.18"
      - run: uv sync
        working-directory: ./
      - name: Build docs website
        run: uv run invoke docs

  validate-documentation-style:
    if: |
      always() && !cancelled() &&
      !contains(needs.*.result, 'failure') &&
      !contains(needs.*.result, 'cancelled')
    needs: ["files-changed", "yaml-lint", "python-lint", "markdown-lint"]
    runs-on: "ubuntu-22.04"
    timeout-minutes: 5
    env:
      VALE_VERSION: "3.13.0"
    steps:
      - uses: "actions/checkout@v7"
        with:
          submodules: true

      # The official GitHub Action for Vale doesn't work, installing manually instead:
      # https://github.com/errata-ai/vale-action/issues/103
      - name: Download Vale
        run: |
          curl -sL "https://github.com/errata-ai/vale/releases/download/v${VALE_VERSION}/vale_${VALE_VERSION}_Linux_64-bit.tar.gz" -o vale.tar.gz
          tar -xzf vale.tar.gz
      - name: "Validate documentation style"
        # docs/superpowers/ holds historical plans/specs, not user-facing
        # documentation — exclude it from style validation (same rationale
        # as the rumdl exclude in pyproject.toml).
        run: |
          ./vale $(find ./docs -type f \
            \( -name "*.mdx" -o -name "*.md" \) \
            -not -path "./docs/superpowers/*")
